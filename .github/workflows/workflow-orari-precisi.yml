name: CacciatoreDiOfferte - Orari Precisi

on:
  schedule:
    - cron: '0 9 * * *'   # 10:00 IT - VOGHION
    - cron: '15 9 * * *'  # 10:15 RECUPERO Voghion se ritardo
    - cron: '0 13 * * *'  # 14:00 IT - MYLEAD
    - cron: '15 13 * * *' # 14:15 RECUPERO MyLead
    - cron: '0 15 * * *'  # 16:00 IT - THUN
    - cron: '15 15 * * *' # 16:15 RECUPERO Thun
    - cron: '0 17 * * *'  # 18:00 IT - ALIEXPRESS
    - cron: '15 17 * * *' # 18:15 RECUPERO AliExpress <- FIX 18:00!
    - cron: '0 19 * * *'  # 20:00 IT - BAZTA
    - cron: '15 19 * * *' # 20:15 RECUPERO Bazta
    - cron: '0 20 * * *'  # 21:00 IT - DOCTORQUALITY
    - cron: '15 20 * * *' # 21:15 RECUPERO DoctorQuality
  workflow_dispatch:
    inputs:
      store:
        description: 'Quale negozio testare? (vuoto = tutti)'
        required: false
        default: ''

jobs:
  posta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt || pip install requests beautifulsoup4 || true
      - name: Posta in base all'ora italiana
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          AWIN_FEED_VOGHION: ${{ secrets.AWIN_FEED_VOGHION }}
          AWIN_FEED_THUN: ${{ secrets.AWIN_FEED_THUN }}
          AWIN_FEED_BAZTA: ${{ secrets.AWIN_FEED_BAZTA }}
          AWIN_FEED_ALIEXPRESS: ${{ secrets.AWIN_FEED_ALIEXPRESS }}
          AWIN_FEED_DOCTORQUALITY: ${{ secrets.AWIN_FEED_DOCTORQUALITY }}
          MYLEAD_API_KEY: ${{ secrets.MYLEAD_API_KEY }}
          MYLEAD_USERNAME: ${{ secrets.MYLEAD_USERNAME }}
          MYLEAD_PASSWORD: ${{ secrets.MYLEAD_PASSWORD }}
          MYLEAD_TOP_MANUALE: ${{ secrets.MYLEAD_TOP_MANUALE }}
          MYLEAD_TOP_MANUALE_GIOCHI: ${{ secrets.MYLEAD_TOP_MANUALE_GIOCHI }}
          INPUT_STORE: ${{ inputs.store }}
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import subprocess, sys, os
          ora_dt = datetime.now(timezone.utc) + timedelta(hours=1)
          ora = ora_dt.hour
          minuto = ora_dt.minute
          print(f'Ora italiana: {ora}:{minuto:02d}')
          # Se test manuale con store scelto, posta solo quello
          store_forzato = os.environ.get('INPUT_STORE','').strip().lower()
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and store_forzato:
              print(f'TEST manuale solo: {store_forzato}')
              mappa_test = {'mylead': 'mylead'}
              if store_forzato == 'mylead':
                  subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'app'])
                  subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'giochi'])
              else:
                  subprocess.run([sys.executable, 'caccia_feed.py', store_forzato])
                  subprocess.run([sys.executable, 'posta_store.py', store_forzato])
              sys.exit(0)
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and not store_forzato:
              print('TEST manuale: posto tutti')
              for s in ['voghion','thun','aliexpress','bazta','doctorquality']:
                  subprocess.run([sys.executable, 'caccia_feed.py', s])
                  subprocess.run([sys.executable, 'posta_store.py', s])
              subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'app'])
              subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'giochi'])
              sys.exit(0)
          # SCHEDULATO: tolleranza 0-30 minuti - se GitHub ritarda, posta comunque!
          # Es: run delle 18:00 partito alle 18:15 -> ora=18, minuto=15 -> posta aliexpress
          mappa = {10: ('voghion','feed'), 14: ('mylead','mylead'), 16: ('thun','feed'), 18: ('aliexpress','feed'), 20: ('bazta','feed'), 21: ('doctorquality','feed')}
          if ora in mappa and minuto < 35:
              store, tipo = mappa[ora]
              print(f'Posto: {store} (ora {ora}:{minuto:02d} dentro tolleranza)')
              if tipo == 'mylead':
                  subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'app'])
                  subprocess.run([sys.executable, 'auto_mylead_tipo.py', 'giochi'])
              else:
                  subprocess.run([sys.executable, 'caccia_feed.py', store])
                  subprocess.run([sys.executable, 'posta_store.py', store])
          else:
              print(f'Fuori tolleranza o nessuna fascia: ora {ora}:{minuto:02d}, salto per non duplicare')
          "
