name: Top10 Altri Store - Gratis GitHub

# FIX: se un file manca, non si blocca tutto. Va avanti lo stesso.
# Amazon resta su Render. Questi 4 girano qui gratis.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  caccia-altri-store:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice da GitHub
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: |
          pip install -r requirements.txt || pip install requests

      - name: Caccia Top10 Altri Store
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "=== Provo ogni file, se manca vado avanti, non mi fermo ==="
          python caccia_top10_per_store.py || echo "caccia_top10_per_store saltato / finito con avviso"
          python caccia_senza_api.py || echo "caccia_senza_api non trovato, vado avanti"
          python caccia_top10_qualita_prezzo.py || echo "qualita_prezzo non trovato, vado avanti"
          python agente_nomi_da_foto.py || echo "NOMI non trovato / niente da sistemare, vado avanti"
          python posta_con_capo_approvazione.py || echo "POST non trovato / niente da postare, vado avanti"
          echo "=== FINE - Workflow finito senza bloccarsi ==="
