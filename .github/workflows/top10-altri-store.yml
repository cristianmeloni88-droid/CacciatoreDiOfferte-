# SHARDAN - Workflow V3 NUOVO - CON SKIMLINKS - 14 Nov 2026
# Se vedi questo commento, è il NUOVO! Il vecchio non ha SKIMLINKS!
name: Top10 Altri Store V3 Skimlinks

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/top10-altri-store.yml'

jobs:
  caccia-altri-store-v3-skimlinks:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice da GitHub
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests || true

      - name: Caccia Top10 V3 con Skimlinks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          SKIMLINKS_ID: ${{ secrets.SKIMLINKS_ID }}
        run: |
          echo "=== WORKFLOW V3 NUOVO CON SKIMLINKS - Se vedi questa riga, e il NUOVO! ==="
          echo "=== Provo ogni file, se manca vado avanti, non mi fermo ==="
          python caccia_awin_top10.py || echo "caccia_awin saltato, vado avanti"
          echo "--- CACCIA MediaWorld Decathlon V3 ---"
          python caccia_mediaworld_decathlon.py || echo "caccia mediaworld/decathlon saltato, vado avanti"
          echo "--- SKIMLINKS TEST V3 - Deve dire SI ---"
          python skimlinks.py || echo "skimlinks test saltato"
          echo "--- File creati ---"
          ls -lh top10*.csv || echo "nessun top10 csv"
          echo "--- NOMI: sistema nomi e prezzi ---"
          python agente_nomi_da_foto.py || echo "NOMI saltato, vado avanti"
          echo "--- POST: manda su Telegram con Skimlinks ---"
          python posta_telegram_formato_shardan.py || echo "POST saltato, vado avanti"
          echo "=== Workflow V3 finito senza bloccarsi ==="
