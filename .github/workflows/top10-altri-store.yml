name: Top10 Altri Store - Gratis GitHub

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  caccia-altri-store:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice da GitHub
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Caccia Top10 Altri Store
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
        run: |
          echo "=== Provo ogni file, se manca vado avanti, non mi fermo ==="
          python caccia_awin_top10.py || echo "caccia_awin non partito, vado avanti"
          echo "--- File creati ---"
          ls -lh top10*.csv || echo "nessun top10 csv"
          echo "--- NOMI: sistema nomi e prezzi ---"
          python agente_nomi_da_foto.py || echo "NOMI non trovato, vado avanti"
          echo "--- POST: manda su Telegram ---"
          python posta_telegram_formato_shardan.py || echo "POST non trovato, niente da postare, vado avanti"
          echo "=== Workflow finito senza bloccarsi ==="
          
